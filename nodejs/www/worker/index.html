<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>งานที่ต้องแก้ไข – ทุกโปรเจค</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.12.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./../assets/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="container mt-5">
        <input type="hidden" id="chkLogin">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="page-header d-flex align-items-center gap-3">
                <div class="page-icon"><i class="bi bi-tools"></i></div>
                <div>
                    <h1 class="mb-0" style="font-size:1.6rem;">งานที่ต้องแก้ไข</h1>
                    <p class="text-muted mb-0">สรุปแปลงที่แอดมินตรวจแล้ว "ไม่ผ่าน" ของแต่ละคน ทุกโปรเจค แบบเรียลไทม์</p>
                </div>
            </div>
            <div id="user-panel" class="d-flex align-items-center">
                <div id="profile-section" class="dropdown d-flex align-items-center" style="display: none !important;">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <img id="profile-image" class="rounded-circle me-2"
                            style="width: 32px; height: 32px; object-fit: cover" alt="Profile picture">
                        <span id="display-name" class="fw-medium"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/rub/index.html"><i class="bi bi-speedometer2 me-1"></i> แดชบอร์ด</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logout-link">Logout</a></li>
                    </ul>
                </div>
                <a href="/rub/auth/google" id="google-login-link">
                    <img src="https://developers.google.com/identity/images/btn_google_signin_dark_normal_web.png"
                        alt="Sign in with Google">
                </a>
            </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <a href="/rub/index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>กลับแดชบอร์ด
            </a>
            <div class="d-flex align-items-center gap-3">
                <span id="lastUpdated" class="small text-muted"></span>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
                    <label class="form-check-label small" for="autoRefreshToggle">รีเฟรชอัตโนมัติ</label>
                </div>
                <button class="btn btn-success btn-sm" id="btnRefreshNow">
                    <i class="bi bi-arrow-clockwise me-1"></i>รีเฟรชเลย
                </button>
            </div>
        </div>

        <!-- Summary cards -->
        <div class="row g-3 mb-4" id="summaryCards"></div>

        <!-- Worker list -->
        <div id="workerListWrap">
            <div class="text-center text-muted py-5">
                <div class="spinner-border spinner-border-sm me-2"></div>กำลังโหลดข้อมูล...
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
